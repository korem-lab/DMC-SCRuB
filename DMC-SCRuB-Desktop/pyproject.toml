[project]
name = "dmcscrub-app"
version = "0.2.0"
description = "PySide6 desktop app for C-SCRuB and DMC-SCRuB"
authors = [
    { name = "Guanlin Chen", email = "gc3257@cumc.columbia.edu" },
    { name = "George I. Austin", email = "gia2105@columbia.edu" },
]
requires-python = ">=3.10"
dependencies = [
    "DMC-SCRuB @ git+https://github.com/korem-lab/DMC-SCRuB.git",
    "numpy<2",
    "pandas",
    "pyside6",
    "pytorch-lightning>=1.8,<2.0",
    "scipy",
    "scikit-learn",
    "setuptools<81",
    "torch",
    "torchmetrics<1.0",
    "torchsort",
    "lightning-utilities",
]

[project.scripts]
dmcscrub-app = "dmcscrub_app.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# UI assets are loaded through importlib.resources.
dmcscrub_app = [
    "resources/*.qss",
    "resources/*.svg",
    "resources/*.png",
    "resources/*.jpg",
    "resources/*.jpeg",
    "resources/*.webp",
    "resources/*.md",
]
